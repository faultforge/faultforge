syntax = "proto3";
package faultforge.v1;

// One long-lived bidi stream: agent dials in, master pushes down.
// NOTE: the RPC is named `Session` (not `Connect`) because tonic generates a
// `connect()` constructor on the client, which would collide with an RPC method
// of the same name.
service AgentService {
  rpc Session(stream AgentMessage) returns (stream ServerMessage);
}

message AgentMessage {
  oneof payload {
    Register register = 1;
    Heartbeat heartbeat = 2;
  }
}

message Register {
  string agent_id = 1;   // stable UUID, self-generated by the agent
  string name = 2;       // hostname default; seeds master record on first registration
  string hostname = 3;
  string os = 4;
  string arch = 5;
  string version = 6;
}

message Heartbeat {}

message ServerMessage {
  oneof payload {
    RegisterAck register_ack = 1;
    // reserved for the next slice: Command command = 2;
  }
}

message RegisterAck {
  int64 server_time_unix_ms = 1;
  uint32 heartbeat_interval_secs = 2;
}
