[workspace]
resolver = "3"
members = [ "crates/agent", "crates/cli", "crates/e2e", "crates/fault", "crates/master", "crates/plugins/noop-marker", "crates/proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Pinned versions of the shared gRPC stack. The whole tonic/prost set moves
# together; bump them as a group only after a matching toolchain upgrade.
[workspace.dependencies]
prost = "0.14"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.2.0"

tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
config = "0.15.24"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Manifest YAML parsing. serde_norway is a maintained drop-in fork of the archived
# serde_yaml (identical API); see the implement-fault-schema change's design.md D5
# for the fallback rationale.
serde_norway = "0.9"
# Plugin digest: sha256 over manifest + executable bytes, lowercase-hex encoded.
sha2 = "0.10"
hex = "0.4"
# RFC3339 timestamps for plugin NDJSON events without pulling in chrono.
humantime = "2"
# Runtime dep of noop-marker (preflight writability probe + atomic marker write)
# and a dev-dep for catalog/plugin tests.
tempfile = "3"
axum = "0.8"
hostname = "0.4"
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
ratatui = "0.30"
crossterm = "0.29"

[workspace.lints.rust]
# future-incompatible and unused lints (already covered by default, but explicit is clearer)

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Curated allow-list — add entries here as needed when pedantic is too noisy
# Convention #6: no unwrap/expect outside tests; test code carries cfg_attr(test, allow(...))
unwrap_used = "warn"
expect_used = "warn"
